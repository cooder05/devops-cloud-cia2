
---
- name: Deploy Java application to Azure Kubernetes Service
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    namespace: default
    deployment_name: java-cicd-demo
    service_name: java-cicd-demo-service
    manifest_path: /tmp/deployment.yaml

  tasks:

    - name: Validate Docker image name
      ansible.builtin.assert:
        that:
          - lookup('env', 'IMAGE') | length > 0
        fail_msg: "IMAGE environment variable is not set."

    - name: Check AKS connectivity
      ansible.builtin.command:
        cmd: kubectl cluster-info
      changed_when: false

    - name: Check generated Kubernetes manifest
      ansible.builtin.stat:
        path: "{{ manifest_path }}"
      register: manifest_file

    - name: Validate generated manifest
      ansible.builtin.assert:
        that:
          - manifest_file.stat.exists
          - manifest_file.stat.size > 0
        fail_msg: "Kubernetes deployment manifest is missing or empty."

    - name: Apply Kubernetes deployment manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ manifest_path }}"
          - --namespace
          - "{{ namespace }}"

    - name: Wait for deployment rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - "deployment/{{ deployment_name }}"
          - "--namespace"
          - "{{ namespace }}"
          - "--timeout=180s"
      changed_when: false

    - name: Retrieve deployment status
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - "{{ deployment_name }}"
          - "--namespace"
          - "{{ namespace }}"
      register: deployment_status
      changed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        var: deployment_status.stdout

    - name: Retrieve pod status
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - "--namespace"
          - "{{ namespace }}"
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        var: pod_status.stdout

    - name: Retrieve service details
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - service
          - "{{ service_name }}"
          - "--namespace"
          - "{{ namespace }}"
      register: service_status
      changed_when: false

    - name: Display service details
      ansible.builtin.debug:
        var: service_status.stdout
